name: OMAPI Safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Dart OMAPI safety tests
        run: flutter test test/omapi_safety_test.dart
      - name: Android OMAPI safety tests
        working-directory: android
        run: ./gradlew testCommunityDebugUnitTest
      - name: Compile Android plugin
        working-directory: android
        run: ./gradlew compileCommunityDebugKotlin
